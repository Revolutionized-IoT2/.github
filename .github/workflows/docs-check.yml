name: Docs drift check

# Checks every RIoT2 repository's documentation against the code and the platform contracts.
# See tools/docs-check/README.md. Runs on hub changes, weekly (code in other repositories may have
# drifted from the docs), on demand, and as a reusable workflow for other repositories' PRs.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        description: "Repository under test (for example RIoT2.Core); checked out at 'ref' instead of its default branch"
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref of the repository under test"
        type: string
        required: false
        default: ""
    secrets:
      DOCS_CHECK_TOKEN:
        description: "Token with read access to the private RIoT2 repositories (optional; they are skipped without it)"
        required: false

permissions:
  contents: read

env:
  REPOS: >-
    RIoT2.Core RIoT2.Net.Orchestrator RIoT2.Net.Node RIoT2.Net.Devices RIoT2.Net.RasPi.Devices
    RIoT2.Elsa RIoT2.Connector.InfluxDB RIoT2.UI RIoT2.Mobile RIoT2.Matter RIoT2.Ard.Shared
    RIoT2.Ard.M5Core2.Node RIoT2.Ard.M5Dial.Node RIoT2.Ard.WiegandI2C RIoT2.Tests

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the hub
        uses: actions/checkout@v4
        with:
          repository: Revolutionized-IoT2/.github
          ref: ${{ github.repository == 'Revolutionized-IoT2/.github' && github.sha || 'main' }}
          path: ws/.github

      - name: Clone the other repositories (default branches)
        working-directory: ws
        env:
          # Public repositories are cloned anonymously. Private ones need DOCS_CHECK_TOKEN; the
          # github.token fallback covers a private repository under test calling this workflow.
          TOKEN: ${{ secrets.DOCS_CHECK_TOKEN || github.token }}
          UNDER_TEST: ${{ inputs.repository }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          for r in $REPOS; do
            url="https://github.com/Revolutionized-IoT2/$r.git"
            if git clone --quiet --depth 1 "$url" "$r" 2>/dev/null ||
               git clone --quiet --depth 1 -c "http.https://github.com/.extraheader=$auth" "$url" "$r"; then
              continue
            fi
            if [ "$r" = "$UNDER_TEST" ]; then
              echo "::error::Cannot clone $r, the repository under test"
              exit 1
            fi
            echo "::warning::Skipped $r: not accessible (private repositories need the DOCS_CHECK_TOKEN secret)"
          done

      - name: Use the ref under test
        if: ${{ inputs.repository != '' }}
        working-directory: ws/${{ inputs.repository }}
        run: |
          git fetch --quiet --depth 1 origin "${{ inputs.ref }}"
          git checkout --quiet FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the checker
        run: python ws/.github/tools/docs-check/test_check_docs.py

      - name: Check documentation
        run: python ws/.github/tools/docs-check/check_docs.py --workspace ws

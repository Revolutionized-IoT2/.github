# How install.sh sets up the Raspberry Pi node (not secret, so not encrypted). KEY=value lines.

# The node's plugins. RIoT2.Net.RasPi.Devices releases need a GitHub login, so copy them into
# deploy/plugins on the Pi by hand, or set the plugin package URL in the UI; leave this empty then.
PLUGIN_URL=
PLUGIN_SHA256=
PUBLISH_WORKFLOWS=auto
SEED_RULES="node-data/netatmoAuth-*.json=once node-data/service_account.json=managed"
VOLUME_OWNERS=
# The node publishes its port on the Pi's own address: no LAN network to manage.
LAN_DRIVER=
LAN_PARENT=
LAN_SUBNET=
LAN_GATEWAY=
LAN_IP_RANGE=
LAN_IPV6_SUBNET=
LAN_IPV6_GATEWAY=

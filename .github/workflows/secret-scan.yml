name: Secret scan

# Reusable: scans the full git history of the calling repository with gitleaks. The repository's
# own .gitleaks.toml is used when present. Same pinned version as tools/secret-scan/scan.ps1.

on:
  workflow_call:

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Linux runs a script only with its executable bit, which a Windows checkout can't show.
      - name: Shell scripts are executable
        run: |
          bad=0
          while IFS=$'\t' read -r meta path; do
            if [ "${meta%% *}" != 100755 ]; then
              echo "::error file=$path::$path isn't executable in git. Run: git update-index --chmod=+x $path"
              bad=1
            fi
          done < <(git ls-files -s -- '*.sh')
          exit "$bad"

      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$file" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        run: |
          config=()
          if [ -f .gitleaks.toml ]; then config=(--config .gitleaks.toml); fi
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1 "${config[@]}"

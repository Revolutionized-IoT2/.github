# Grafana loads the dashboards in this folder (deploy/compose.observability.yml): riot2-system.json
# is the "RIoT2 system" dashboard. Its metric names are in docs/contracts/metrics.md; docs-check
# fails when it uses a riot2_* metric the code doesn't have.
apiVersion: 1

providers:
  - name: RIoT2
    folder: RIoT2
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards

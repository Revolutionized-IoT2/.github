# Mosquitto for RIoT2 (deploy/docker-compose.yml). start.sh writes the password file from .env
# on every start. To add TLS on 8883 for ESP32 firmware, add a listener with certfile and keyfile:
# https://mosquitto.org/man/mosquitto-conf-5.html
persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
password_file /mosquitto/auth/password.txt

# MQTT for the .NET services, nodes and ESP32 firmware
listener 1883

# MQTT over WebSocket for the UI; the browser code always uses port 9001
listener 9001
protocol websockets

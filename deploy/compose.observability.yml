# Metrics for RIoT2 (design 7.4): the OpenTelemetry Collector receives OTLP from every .NET
# service, Prometheus scrapes it and the RIoT2 Prometheus exporter (the latest report values), and
# Grafana shows the provisioned "RIoT2 system" and "RIoT2 values" dashboards.
#
#   # in .env: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
#   docker compose -f docker-compose.yml -f compose.observability.yml up -d --wait
#
# Add compose.influx.yml too for InfluxDB: Grafana is the same service in both files, and then has
# both data sources. A node on another host (compose.node-raspi.yml) sends to
# http://<RIOT2_HOST>:4317; so does the orchestrator with compose.matter.yml (host network), as
# http://127.0.0.1:4317. Metric names: docs/contracts/metrics.md.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${RIOT2_OTLP_HOST_PORT:-4317}:4317" # OTLP over gRPC, for services on other hosts

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${RIOT2_METRICS_RETENTION:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${RIOT2_PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The RIoT2 Prometheus exporter (design 7.3): the latest value of every report as riot2_value, scraped by
  # Prometheus (prometheus/prometheus.yml) and shown on the "RIoT2 values" dashboard.
  prometheus-exporter:
    image: ghcr.io/revolutionized-iot2/riot2-prometheus-exporter:1.1.0
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      RIOT2_MQTT_IP: mosquitto
      RIOT2_MQTT_USERNAME: ${RIOT2_MQTT_USERNAME:?set RIOT2_MQTT_USERNAME in .env}
      RIOT2_MQTT_PASSWORD: ${RIOT2_MQTT_PASSWORD:?set RIOT2_MQTT_PASSWORD in .env}
      RIOT2_CONNECTOR_ID: riot2-prometheus-exporter
      RIOT2_CONNECTOR_URL: http://prometheus-exporter:8080
      RIOT2_SECURITY_MODE: ${RIOT2_SECURITY_MODE:-off}
      RIOT2_API_KEY: ${RIOT2_PROMETHEUS_EXPORTER_API_KEY:-}
      RIOT2_HANDLE_COMMANDS: ${RIOT2_HANDLE_COMMANDS:-false}
      RIOT2_PROMETHEUS_MAX_AGE_MINUTES: ${RIOT2_PROMETHEUS_MAX_AGE_MINUTES:-60}
      RIOT2_LOG_FORMAT: ${RIOT2_LOG_FORMAT:-text}
      RIOT2_LOG_LEVEL: ${RIOT2_LOG_LEVEL:-Information}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      TZ: ${TZ:-Europe/Helsinki}

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${RIOT2_GRAFANA_ADMIN_PASSWORD:?set RIOT2_GRAFANA_ADMIN_PASSWORD in .env}
      TZ: ${TZ:-Europe/Helsinki}
    ports:
      - "${RIOT2_GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  prometheus-data:
  grafana-data:

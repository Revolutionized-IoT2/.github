name: Plugin release

# Reusable: publishes a device plugin and keeps the plugin zip its build produced. CI calls it with
# publish: false and keeps the zip as an artifact; release.yml calls it with publish: true to
# attach the zip and its .sha256 sidecar to a GitHub release.
#
# The zip, PluginManifest.json inside it and the sidecar come from the RIoT2PluginPack target of
# RIoT2.Core.Devices.Build (plan M12 step 3), which the plugin references, so a local
# "dotnet publish" produces the same zip. This workflow only checks and uploads it: one zip, a
# matching sidecar, the expected version, and no RIoT2.Core*.dll inside. It adds <zip>.spdx.json, an
# SPDX SBOM of the publish output (I33): every package the plugin depends on, including those the
# node supplies, with the versions from its deps.json.

on:
  workflow_call:
    inputs:
      project:
        description: "Plugin project, relative to the repository root"
        type: string
        required: true
      name:
        description: "Overrides the project's RIoT2PluginName (\"name\" in PluginManifest.json)"
        type: string
        default: ""
      package:
        description: "The project's RIoT2PluginPackage (the zip is <package>_<version>.zip); also names the check"
        type: string
        default: ""
      version:
        description: "Plugin version. Default: the tag name for tag builds, otherwise 0.0.0-ci.<run number>."
        type: string
        default: ""
      publish:
        type: boolean
        default: false
      dotnet-version:
        type: string
        default: "10.0.x"
    secrets:
      NUGET_PACKAGE_TOKEN:
        description: "Token that can read the RIoT2 packages. Falls back to GITHUB_TOKEN."
        required: false

jobs:
  package:
    # Callers pass package so the required check keeps its name: "<caller job> / plugin <package>".
    name: plugin ${{ inputs.package || inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Add the RIoT2 package feed
        env:
          TOKEN: ${{ secrets.NUGET_PACKAGE_TOKEN || github.token }}
        run: >
          dotnet nuget add source "https://nuget.pkg.github.com/Revolutionized-IoT2/index.json"
          --name riot2 --username "$GITHUB_ACTOR" --password "$TOKEN" --store-password-in-clear-text

      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; else VERSION="0.0.0-ci.$GITHUB_RUN_NUMBER"; fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish and pack
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ inputs.name }}
          PACKAGE: ${{ inputs.package }}
        run: |
          extra=()
          if [ -n "$NAME" ]; then extra+=("-p:RIoT2PluginName=$NAME"); fi
          if [ -n "$PACKAGE" ]; then extra+=("-p:RIoT2PluginPackage=$PACKAGE"); fi
          dotnet publish "$PROJECT" --configuration Release --output "$RUNNER_TEMP/publish" \
            -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true \
            -p:RIoT2PluginOutputDir="$RUNNER_TEMP/out/" "${extra[@]}"

      - name: Check the plugin zip
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/out"
          shopt -s nullglob
          zips=("$out"/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one plugin zip in $out, found ${#zips[@]}. Does the plugin reference RIoT2.Core.Devices.Build?"
            exit 1
          fi
          zip=$(basename "${zips[0]}")
          if [ ! -f "$out/$zip.sha256" ]; then echo "::error::$zip.sha256 is missing"; exit 1; fi
          (cd "$out" && sha256sum -c "$zip.sha256")
          unzip -l "$out/$zip"
          # The node's own RIoT2.Core assemblies must never ship in a plugin.
          if unzip -Z1 "$out/$zip" | grep -E '^RIoT2\.Core[^/]*\.dll$'; then echo "::error::$zip contains RIoT2.Core assemblies"; exit 1; fi
          manifest=$(unzip -p "$out/$zip" PluginManifest.json)
          echo "$manifest"
          name=$(jq -er .name <<< "$manifest")
          jq -er .coreVersion <<< "$manifest" > /dev/null
          if [ "$(jq -r .version <<< "$manifest")" != "$VERSION" ]; then echo "::error::PluginManifest.json version is not $VERSION"; exit 1; fi
          if [ "$(jq -r .installedPackageFilename <<< "$manifest")" != "$zip" ]; then echo "::error::installedPackageFilename is not $zip"; exit 1; fi
          {
            echo "zip=$zip"
            echo "name=$name"
            echo "package=${zip%_"$VERSION".zip}"
          } >> "$GITHUB_OUTPUT"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/publish
          format: spdx-json
          output-file: ${{ runner.temp }}/out/${{ steps.zip.outputs.zip }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.package }}-plugin
          path: ${{ runner.temp }}/out/*

      - name: Attach to the GitHub release
        if: inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.zip.outputs.name }} ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ runner.temp }}/out/${{ steps.zip.outputs.zip }}
            ${{ runner.temp }}/out/${{ steps.zip.outputs.zip }}.sha256
            ${{ runner.temp }}/out/${{ steps.zip.outputs.zip }}.spdx.json
          fail_on_unmatched_files: true

# Grafana loads the dashboards in this folder (deploy/compose.observability.yml mounts it at
# /etc/grafana/dashboards/riot2 and this file as a provider): riot2-system.json is the "RIoT2 system"
# dashboard, riot2-values.json "RIoT2 values" (the Prometheus exporter's report values). Their metric
# names are in docs/contracts/metrics.md; docs-check fails when one uses a riot2_* metric the code
# doesn't have. An installation's own dashboards go in grafana/site-dashboards/ (../site-dashboards.yml).
apiVersion: 1

providers:
  - name: RIoT2
    folder: RIoT2
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/riot2

# How install.sh and install.ps1 set up this host (not secret, so not encrypted). KEY=value lines.

# The node's device plugins: a release package and its SHA-256 (empty: the package's .sha256 file),
# for example https://github.com/Revolutionized-IoT2/RIoT2.Net.Devices/releases/download/<version>/RIoT2.Net.Devices_<version>.zip
# Use the release that matches the node image. Empty: the installer leaves plugins/ alone (when the
# node gets its plugins from the plugin package URL set in the UI, for example).
PLUGIN_URL=
PLUGIN_SHA256=

# Imported workflows: auto publishes the ones that were published when exported; true; false.
PUBLISH_WORKFLOWS=auto

# Files under volumes/<volume>/: "once" is copied only where the volume lacks it (tokens the
# service renews itself), "managed" is always the site's. The first matching glob wins; a file
# without a rule is "once".
SEED_RULES="node-data/netatmoAuth-*.json=once node-data/service_account.json=managed orchestrator-matter/attestation/*=managed"
# <volume>=<uid>:<gid> for volumes the installer doesn't know the owner of.
VOLUME_OWNERS=

# The external network of compose.lan.yml (RIOT2_LAN_NETWORK in deploy.env), created when it's
# missing. LAN_DRIVER: qnet (QNAP Container Station) or macvlan; empty: the installer doesn't touch
# it. LAN_PARENT: the host's LAN interface (ip -br addr). LAN_IP_RANGE: addresses Docker may hand
# out by itself (the spare ones); the services' own addresses are fixed in deploy.env.
LAN_DRIVER=qnet
LAN_PARENT=br0
LAN_SUBNET=192.168.1.0/24
LAN_GATEWAY=192.168.1.1
LAN_IP_RANGE=192.168.1.38/31
# IPv6 for Matter: the LAN's /64 prefix, or a unique local one; empty: IPv4 only.
LAN_IPV6_SUBNET=
LAN_IPV6_GATEWAY=

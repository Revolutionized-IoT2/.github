# A RIoT2 node on a Raspberry Pi with GPIO, I2C, serial and Bluetooth access, using the
# RIoT2.Net.RasPi.Devices plugins. Run it on the Pi itself, next to its own .env (the "Raspberry
# Pi node" section of .env.example), and point it at the broker of the main installation:
#
#   docker compose -f compose.node-raspi.yml up -d --wait

name: riot2-node

services:
  node:
    image: ghcr.io/revolutionized-iot2/riot2-node:1.5.0-arm64v8
    restart: unless-stopped
    # Hardware access (GPIO, I2C, serial) needs a privileged container.
    privileged: true
    environment:
      RIOT2_NODE_ID: ${RIOT2_NODE_ID:?set RIOT2_NODE_ID in .env}
      RIOT2_NODE_URL: http://${RIOT2_HOST:?set RIOT2_HOST in .env to the address of the Pi}:${RIOT2_NODE_HOST_PORT:-80}
      RIOT2_MQTT_IP: ${RIOT2_MQTT_IP:?set RIOT2_MQTT_IP in .env to the broker host}
      RIOT2_MQTT_USERNAME: ${RIOT2_MQTT_USERNAME:?set RIOT2_MQTT_USERNAME in .env}
      RIOT2_MQTT_PASSWORD: ${RIOT2_MQTT_PASSWORD:?set RIOT2_MQTT_PASSWORD in .env}
      TZ: ${TZ:-Europe/Helsinki}
    ports:
      - "${RIOT2_NODE_HOST_PORT:-80}:80"
    volumes:
      - node-data:/app/Data
      - node-logs:/app/Logs
      # Copy the plugin files (RIoT2.Net.RasPi.Devices, RIoT2.Net.Devices or both) here, then restart.
      - ${RIOT2_NODE_PLUGINS:-./plugins}:/app/Plugins
      # Bluetooth goes through the host's D-Bus.
      - /var/run/dbus:/var/run/dbus:ro

volumes:
  node-data:
  node-logs:

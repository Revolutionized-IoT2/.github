# InfluxDB 2, Grafana and the RIoT2 InfluxDB connector, on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f compose.influx.yml up -d --wait
#
# On first start InfluxDB creates the organization, the bucket and an admin token from .env; later
# starts reuse the influxdb-data volume and ignore those values. Grafana gets the InfluxDB data
# source from grafana/datasources/influxdb.yml. Point schema for queries: the RIoT2.Connector.InfluxDB README.

services:
  influxdb:
    image: influxdb:2.9.1
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${RIOT2_INFLUXDB_ADMIN_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${RIOT2_INFLUXDB_ADMIN_PASSWORD:?set RIOT2_INFLUXDB_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${RIOT2_INFLUXDB_ORGANIZATION:-riot2}
      DOCKER_INFLUXDB_INIT_BUCKET: ${RIOT2_INFLUXDB_BUCKET:-riot2}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${RIOT2_INFLUXDB_TOKEN:?set RIOT2_INFLUXDB_TOKEN in .env}
      TZ: ${TZ:-Europe/Helsinki}
    ports:
      - "${RIOT2_INFLUXDB_HOST_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  influxdb-connector:
    image: ghcr.io/revolutionized-iot2/riot2-influxdb:1.2.0
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      RIOT2_MQTT_IP: mosquitto
      RIOT2_MQTT_USERNAME: ${RIOT2_MQTT_USERNAME:?set RIOT2_MQTT_USERNAME in .env}
      RIOT2_MQTT_PASSWORD: ${RIOT2_MQTT_PASSWORD:?set RIOT2_MQTT_PASSWORD in .env}
      RIOT2_CONNECTOR_ID: ${RIOT2_CONNECTOR_ID:-riot2-influxdb}
      RIOT2_INFLUXDB_HOST: http://influxdb:8086
      RIOT2_INFLUXDB_TOKEN: ${RIOT2_INFLUXDB_TOKEN:?set RIOT2_INFLUXDB_TOKEN in .env}
      RIOT2_INFLUXDB_BUCKET: ${RIOT2_INFLUXDB_BUCKET:-riot2}
      RIOT2_INFLUXDB_ORGANIZATION: ${RIOT2_INFLUXDB_ORGANIZATION:-riot2}
      RIOT2_HANDLE_COMMANDS: ${RIOT2_HANDLE_COMMANDS:-false}
      TZ: ${TZ:-Europe/Helsinki}

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${RIOT2_GRAFANA_ADMIN_PASSWORD:?set RIOT2_GRAFANA_ADMIN_PASSWORD in .env}
      # Read by grafana/datasources/influxdb.yml
      INFLUXDB_TOKEN: ${RIOT2_INFLUXDB_TOKEN:?set RIOT2_INFLUXDB_TOKEN in .env}
      INFLUXDB_ORGANIZATION: ${RIOT2_INFLUXDB_ORGANIZATION:-riot2}
      INFLUXDB_BUCKET: ${RIOT2_INFLUXDB_BUCKET:-riot2}
      TZ: ${TZ:-Europe/Helsinki}
    ports:
      - "${RIOT2_GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:

name: .NET validate

# Reusable: restore, build and test a .NET repository. Called by each repository's ci.yml and,
# before publishing, by its release.yml. See docs/guides/ci.md.

on:
  workflow_call:
    inputs:
      build:
        description: "Solution or project to build, relative to the repository root"
        type: string
        required: true
      test:
        description: "Solutions or test projects to test (space-separated). Empty: no tests."
        type: string
        default: ""
      siblings:
        description: "RIoT2 repositories to clone next to this one for ../<repo> project references (space-separated)"
        type: string
        default: ""
      os:
        description: "JSON array of runner images"
        type: string
        default: '["ubuntu-latest"]'
      dotnet-version:
        description: "SDK to install when the repository has no global.json (it should; see build/README.md)"
        type: string
        default: "10.0.x"
      github-packages:
        description: "Add the RIoT2 GitHub Packages feed (RIoT2.Core, RIoT2.Matter)"
        type: boolean
        default: true
      msbuild-args:
        description: "Extra MSBuild arguments for restore, build and test"
        type: string
        default: ""
      verify-generated:
        description: "Fail when the build changes a committed file, such as a generated contract (openapi/)"
        type: boolean
        default: false
    secrets:
      NUGET_PACKAGE_TOKEN:
        description: "Token that can read the RIoT2 packages. Falls back to GITHUB_TOKEN."
        required: false

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      MSBUILD_ARGS: ${{ inputs.msbuild-args }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The workspace is <work>/<repo>/<repo>, so its parent folder plays the role of the local
      # workspace root (C:\Src\RIoT2) and ../<repo> project references resolve.
      - name: Clone sibling repositories
        if: inputs.siblings != ''
        working-directory: ..
        env:
          SIBLINGS: ${{ inputs.siblings }}
        run: |
          for r in $SIBLINGS; do
            git clone --quiet --depth 1 "https://github.com/Revolutionized-IoT2/$r.git" "$r"
            echo "$r $(git -C "$r" rev-parse --short HEAD)"
          done

      # A source <Version> (Directory.Build.repo.props) behind its newest release tag, or a RIoT2.Core
      # package pin above RIoT2.Core's source version, makes RIoT2.Tests import one assembly twice
      # (CS1704). tools/preflight checks the same before a push.
      - name: Check the RIoT2 package versions
        working-directory: ..
        run: |
          bad=0
          REPO="${GITHUB_REPOSITORY#*/}"
          version_of() { sed -n 's:.*<Version>\([0-9][0-9.]*\)</Version>.*:\1:p' "$1/Directory.Build.repo.props" 2>/dev/null | head -n 1; }
          newest() { printf '%s\n' "$@" | sort -V | tail -n 1; }
          own="$(version_of "$REPO")"
          if [ -n "$own" ]; then
            tag="$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY.git" 2>/dev/null |
              sed -n 's:.*refs/tags/\([0-9]*\.[0-9]*\.[0-9]*\)$:\1:p' | sort -V | tail -n 1)"
            if [ -n "$tag" ] && [ "$(newest "$own" "$tag")" != "$own" ]; then
              echo "::error file=Directory.Build.repo.props::<Version> is $own, but $tag is released. Set it to $tag."
              bad=1
            fi
          fi
          core="$(version_of RIoT2.Core)"
          if [ -n "$core" ]; then
            for props in */Directory.Packages.props; do
              while read -r package version; do
                if [ "$(newest "$version" "$core")" != "$core" ]; then
                  echo "::error::$props pins $package $version, above RIoT2.Core's source version $core. Raise <Version> in RIoT2.Core's Directory.Build.repo.props to the released tag."
                  bad=1
                fi
              done < <(grep -oE 'Include="(RIoT2\.Core[A-Za-z.]*|RIoT2\.Connector\.Sdk)" +Version="[0-9.]+"' "$props" |
                sed -E 's/Include="([^"]+)" +Version="([^"]+)"/\1 \2/')
            done
          fi
          exit "$bad"

      # global.json pins the SDK to .NET 10 (ADR 0013). Without it dotnet picks the newest SDK on the
      # runner image, so a new image can change the analyzers under an unchanged commit.
      - uses: actions/setup-dotnet@v6
        if: hashFiles('global.json') != ''
        with:
          global-json-file: global.json

      - uses: actions/setup-dotnet@v6
        if: hashFiles('global.json') == ''
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Show the .NET SDK
        run: |
          if [ ! -f global.json ]; then
            echo "::warning::No global.json: the newest SDK on the runner is used. Copy build/global.json from Revolutionized-IoT2/.github."
          fi
          dotnet --version

      - name: Add the RIoT2 package feed
        if: inputs.github-packages
        env:
          TOKEN: ${{ secrets.NUGET_PACKAGE_TOKEN || github.token }}
        run: >
          dotnet nuget add source "https://nuget.pkg.github.com/Revolutionized-IoT2/index.json"
          --name riot2 --username "$GITHUB_ACTOR" --password "$TOKEN" --store-password-in-clear-text

      - name: Restore
        env:
          BUILD: ${{ inputs.build }}
        run: |
          read -ra extra <<< "$MSBUILD_ARGS"
          dotnet restore "$BUILD" "${extra[@]}"

      - name: Build
        env:
          BUILD: ${{ inputs.build }}
        run: |
          read -ra extra <<< "$MSBUILD_ARGS"
          dotnet build "$BUILD" --configuration Release --no-restore -p:ContinuousIntegrationBuild=true "${extra[@]}"

      - name: Check that generated files are committed
        if: inputs.verify-generated
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            echo "::error::The build changed committed files. Build locally and commit the result."
            exit 1
          fi

      - name: Test
        if: inputs.test != ''
        env:
          TEST: ${{ inputs.test }}
        run: |
          read -ra extra <<< "$MSBUILD_ARGS"
          for t in $TEST; do
            dotnet test "$t" --configuration Release --logger trx \
              --results-directory "$RUNNER_TEMP/test-results" "${extra[@]}"
          done

      - name: Upload test results
        if: always() && inputs.test != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/test-results/*.trx
          if-no-files-found: ignore

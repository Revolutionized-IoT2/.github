name: Node validate

# Reusable: npm ci, then the given npm scripts, for a front-end project.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Folder with package.json and package-lock.json"
        type: string
        default: "."
      node-version:
        type: string
        default: "24"
      scripts:
        description: "npm scripts to run in order (space-separated)"
        type: string
        default: "test build"
      siblings:
        description: "RIoT2 repositories to clone next to this one, for tests that read their files (space-separated)"
        type: string
        default: ""

jobs:
  npm:
    name: npm (${{ inputs.scripts }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The workspace is <work>/<repo>/<repo>, so its parent folder plays the role of the local
      # workspace root (C:\Src\RIoT2) and ../<repo> paths resolve.
      - name: Clone sibling repositories
        if: inputs.siblings != ''
        working-directory: ..
        env:
          SIBLINGS: ${{ inputs.siblings }}
        run: |
          for r in $SIBLINGS; do
            git clone --quiet --depth 1 "https://github.com/Revolutionized-IoT2/$r.git" "$r"
            echo "$r $(git -C "$r" rev-parse --short HEAD)"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for s in $SCRIPTS; do
            npm run "$s"
          done

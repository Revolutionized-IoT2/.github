name: Firmware validate

# Reusable: builds the RIoT2 firmware projects with PlatformIO and runs the native host tests from
# RIoT2.Ard.Shared. The four firmware repositories are cloned side by side, as in the local
# workspace, because the boards build RIoT2.Ard.Shared by path and the tests read all of them.
# RIoT2.Core is cloned too: the native tests read its golden files (contracts/golden).
# The firmware images are uploaded as the artifact "firmware", each with an SPDX SBOM (I33) of the
# PlatformIO platform and the libraries the build resolved (syft can't read PlatformIO projects).

on:
  workflow_call:
    inputs:
      projects:
        description: "PlatformIO projects (repository names) to build, space-separated"
        type: string
        default: "RIoT2.Ard.M5Core2.Node RIoT2.Ard.M5Dial.Node RIoT2.Ard.WiegandI2C"
      native-tests:
        type: boolean
        default: true
      platformio-version:
        type: string
        default: "6.1.19"

jobs:
  firmware:
    name: firmware (${{ inputs.projects }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECTS: ${{ inputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The workspace is <work>/<repo>/<repo>; its parent plays the role of C:\Src\RIoT2.
      - name: Clone the other firmware repositories
        id: clone
        working-directory: ..
        run: |
          for r in RIoT2.Ard.Shared RIoT2.Ard.M5Core2.Node RIoT2.Ard.M5Dial.Node RIoT2.Ard.WiegandI2C RIoT2.Core; do
            if [ ! -d "$r" ]; then
              git clone --quiet --depth 1 "https://github.com/Revolutionized-IoT2/$r.git" "$r"
            fi
            echo "$r $(git -C "$r" rev-parse --short HEAD)"
          done
          echo "pio-key=$(cat ./*/platformio.ini | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO platforms and libraries
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ inputs.platformio-version }}-${{ steps.clone.outputs.pio-key }}
          restore-keys: pio-${{ runner.os }}-${{ inputs.platformio-version }}-

      - name: Install PlatformIO
        env:
          PIO_VERSION: ${{ inputs.platformio-version }}
        run: pip install --disable-pip-version-check --quiet "platformio==$PIO_VERSION"

      - name: Build
        working-directory: ..
        run: |
          for p in $PROJECTS; do
            echo "::group::pio run -d $p"
            pio run -d "$p"
            echo "::endgroup::"
          done

      # Run after the builds: the MQTT, golden and view-model tests reuse the ArduinoJson headers
      # PlatformIO installed.
      - name: Native tests
        if: inputs.native-tests
        working-directory: ../RIoT2.Ard.Shared
        env:
          CXX: g++
        run: |
          python tests/test_firmware_p1.py
          python tests/test_firmware_p2.py
          python tests/test_firmware_architecture.py
          python tests/test_golden_messages.py
          python tests/test_desired_state.py
          python tests/test_view_models.py

      - name: Collect firmware images
        working-directory: ..
        run: |
          out="$RUNNER_TEMP/firmware"
          mkdir -p "$out"
          for p in $PROJECTS; do
            for d in "$p"/.pio/build/*/; do
              env=$(basename "$d")
              for f in firmware.bin firmware.hex manifest.json; do
                if [ -f "$d$f" ]; then cp "$d$f" "$out/$p--$env--$f"; fi
              done
            done
          done
          ls -l "$out"

      - name: Write the SBOMs
        working-directory: ..
        run: |
          python - <<'PY'
          import configparser, datetime, glob, hashlib, json, os, re
          out = os.path.join(os.environ["RUNNER_TEMP"], "firmware")
          home = os.path.expanduser("~/.platformio")
          created = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          def spdx_id(text):
              return "SPDXRef-" + re.sub(r"[^A-Za-z0-9.-]", "-", text)
          def library(folder):
              for name in ("library.json", "library.properties"):
                  path = os.path.join(folder, name)
                  if not os.path.exists(path):
                      continue
                  if name.endswith(".json"):
                      data = json.load(open(path, encoding="utf-8"))
                      repo = data.get("repository")
                      url = repo.get("url") if isinstance(repo, dict) else None
                      return data.get("name"), str(data.get("version", "")), url
                  props = dict(l.split("=", 1) for l in open(path, encoding="utf-8", errors="replace") if "=" in l)
                  return props.get("name", "").strip(), props.get("version", "").strip(), props.get("url", "").strip() or None
              return None
          for project in os.environ["PROJECTS"].split():
              ini = configparser.ConfigParser(strict=False, interpolation=None)
              ini.read(os.path.join(project, "platformio.ini"), encoding="utf-8")
              version_file = os.path.join(project, "VERSION")
              version = open(version_file).read().strip() if os.path.exists(version_file) else "NOASSERTION"
              for build in sorted(glob.glob(os.path.join(project, ".pio", "build", "*", ""))):
                  env = os.path.basename(os.path.dirname(build))
                  images = [f for f in ("firmware.bin", "firmware.hex") if os.path.exists(build + f)]
                  if not images:
                      continue
                  digest = hashlib.sha256(open(build + images[0], "rb").read()).hexdigest()
                  root = {"SPDXID": "SPDXRef-firmware", "name": f"{project} {env}", "versionInfo": version,
                          "downloadLocation": f"https://github.com/Revolutionized-IoT2/{project}",
                          "filesAnalyzed": False, "checksums": [{"algorithm": "SHA256", "checksumValue": digest}]}
                  packages, relations = [root], [{"spdxElementId": "SPDXRef-DOCUMENT", "relationshipType": "DESCRIBES", "relatedSpdxElement": "SPDXRef-firmware"}]
                  section = f"env:{env}"
                  platform = ini.get(section, "platform", fallback=ini.get("env", "platform", fallback=""))
                  if platform:
                      name, _, pinned = platform.partition("@")
                      installed = os.path.join(home, "platforms", name, "platform.json")
                      resolved = json.load(open(installed)).get("version") if os.path.exists(installed) else pinned
                      packages.append({"SPDXID": spdx_id("platform-" + name), "name": f"platformio/{name}", "versionInfo": resolved or "NOASSERTION",
                                       "downloadLocation": "NOASSERTION", "filesAnalyzed": False})
                      relations.append({"spdxElementId": "SPDXRef-firmware", "relationshipType": "DEPENDS_ON", "relatedSpdxElement": packages[-1]["SPDXID"]})
                  for folder in sorted(glob.glob(os.path.join(project, ".pio", "libdeps", env, "*", ""))):
                      found = library(folder)
                      if not found or not found[0]:
                          continue
                      name, lib_version, url = found
                      packages.append({"SPDXID": spdx_id("lib-" + name), "name": name, "versionInfo": lib_version or "NOASSERTION",
                                       "downloadLocation": url or "NOASSERTION", "filesAnalyzed": False})
                      relations.append({"spdxElementId": "SPDXRef-firmware", "relationshipType": "DEPENDS_ON", "relatedSpdxElement": packages[-1]["SPDXID"]})
                  document = {"spdxVersion": "SPDX-2.3", "dataLicense": "CC0-1.0", "SPDXID": "SPDXRef-DOCUMENT",
                              "name": f"{project}-{env}-{version}",
                              "documentNamespace": f"https://github.com/Revolutionized-IoT2/{project}/sbom/{env}-{version}-{digest[:12]}",
                              "creationInfo": {"created": created, "creators": ["Tool: RIoT2 firmware-validate"]},
                              "packages": packages, "relationships": relations}
                  with open(os.path.join(out, f"{project}--{env}--sbom.spdx.json"), "w", encoding="utf-8") as f:
                      json.dump(document, f, indent=2)
                  print(f"{project} {env}: {len(packages) - 1} components")
          PY

      - name: Upload firmware images
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: ${{ runner.temp }}/firmware/*
          if-no-files-found: error

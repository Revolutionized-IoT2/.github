# Static LAN addresses for InfluxDB and Grafana: use it with compose.influx.yml and compose.lan.yml.
#
#   docker compose -f docker-compose.yml -f compose.influx.yml -f compose.lan.yml -f compose.lan.influx.yml up -d --wait
#
# InfluxDB answers on <RIOT2_LAN_IP_INFLUXDB>:8086 and Grafana on <RIOT2_LAN_IP_GRAFANA>:3000. The
# connector only connects outwards and stays on the default network.

services:
  # The UI's menu links to the services' own addresses (UI 1.15.0).
  ui:
    environment:
      VITE_GRAFANA_URL: http://${RIOT2_LAN_IP_GRAFANA:?set RIOT2_LAN_IP_GRAFANA in .env}:3000
      VITE_INFLUXDB_URL: http://${RIOT2_LAN_IP_INFLUXDB:?set RIOT2_LAN_IP_INFLUXDB in .env}:8086

  influxdb:
    ports: !reset []
    networks:
      default:
      lan:
        ipv4_address: ${RIOT2_LAN_IP_INFLUXDB:?set RIOT2_LAN_IP_INFLUXDB in .env}

  grafana:
    ports: !reset []
    networks:
      default:
      lan:
        ipv4_address: ${RIOT2_LAN_IP_GRAFANA:?set RIOT2_LAN_IP_GRAFANA in .env}

networks:
  lan:
    name: ${RIOT2_LAN_NETWORK:-riot2-lan}
    external: true

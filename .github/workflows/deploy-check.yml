name: Deploy check

# The compose install in deploy/ (design 7.4 phase 1, I12): every compose combination must
# validate, and the stack must start healthy on a clean runner from .env.example, with only the
# required values filled in. Backup and restore (phase 3, I21): an orchestrator configuration
# backup restores through the API, and backup.sh/restore.sh and backup.ps1/restore.ps1 bring every
# volume and the InfluxDB data back after the volumes are wiped. The nightly run of the same smoke
# test is I40.

on:
  push:
    branches: ["**"]
    paths: ["deploy/**", ".github/workflows/deploy-check.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: deploy

jobs:
  smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stack and node
            args: -f docker-compose.yml --profile node
            ps_args: -ComposeFile docker-compose.yml -ComposeProfile node
          - name: stack and influx
            args: -f docker-compose.yml -f compose.influx.yml
            ps_args: -ComposeFile docker-compose.yml,compose.influx.yml
    env:
      COMPOSE_ARGS: ${{ matrix.args }}
      PS_ARGS: ${{ matrix.ps_args }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create .env from .env.example
        run: |
          host="$(hostname -I | awk '{print $1}')"
          cp .env.example .env
          set_var() { sed -i "s|^$1=.*|$1=$2|" .env; }
          set_var RIOT2_HOST "$host"
          set_var RIOT2_MQTT_PASSWORD "$(openssl rand -hex 16)"
          set_var ELSA_IDENTITY_SIGNING_KEY "$(openssl rand -base64 48 | tr -d '\n')"
          set_var RIOT2_INFLUXDB_TOKEN "$(openssl rand -hex 32)"
          set_var RIOT2_INFLUXDB_ADMIN_PASSWORD "$(openssl rand -hex 16)"
          set_var RIOT2_GRAFANA_ADMIN_PASSWORD "$(openssl rand -hex 16)"
          mkdir -p plugins
          echo "RIOT2_HOST=$host" >> "$GITHUB_ENV"

      - name: Validate every compose combination
        run: |
          docker compose version
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml --profile node config --quiet
          docker compose -f docker-compose.yml -f compose.influx.yml config --quiet
          docker compose -f docker-compose.yml -f compose.matter.yml config --quiet
          RIOT2_MQTT_IP=broker.example docker compose -f compose.node-raspi.yml config --quiet

      - name: Start the stack and wait until every service is healthy
        run: |
          # shellcheck disable=SC2086 # COMPOSE_ARGS holds several arguments
          docker compose $COMPOSE_ARGS up --detach --wait --wait-timeout 180

      - name: Check the services
        run: |
          get() { curl -fsS "http://$RIOT2_HOST:$1"; }
          get 8080/health; echo
          get 8082/health; echo
          index="$(get 80/)"
          # The UI's bundle must have the broker address rendered into it.
          bundle="$(grep -o '/assets/index[^"]*\.js' <<< "$index" | head -n 1)"
          [[ "$(get "80$bundle")" == *"$RIOT2_HOST"* ]] || { echo "::error::UI bundle lacks RIOT2_HOST"; exit 1; }

          expected="riot2-elsa"
          if [[ "$COMPOSE_ARGS" == *"--profile node"* ]]; then
            expected="$expected riot2-node-1"
            get 8081/health; echo
            version="$(grep -o 'riot2-node:[0-9.]*' docker-compose.yml | cut -d: -f2)"
            manifest="$(get 8081/api/node/manifest)"
            echo "$manifest"
            [[ "$manifest" == *"\"$version\""* ]] || { echo "::error::node manifest is not $version"; exit 1; }
          fi
          for id in $expected; do
            found=""
            for _ in $(seq 1 30); do
              if [[ "$(get 8080/api/nodes/online)" == *"\"$id\""* ]]; then found=1; break; fi
              sleep 2
            done
            [[ -n "$found" ]] || { echo "::error::$id did not register with the orchestrator"; exit 1; }
          done

          if [[ "$COMPOSE_ARGS" == *"compose.influx.yml"* ]]; then
            password="$(grep '^RIOT2_GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-)"
            curl -fsS -u "admin:$password" "http://$RIOT2_HOST:3000/api/datasources/uid/riot2-influxdb/health"; echo
          fi

      - name: Configuration backup and restore (orchestrator API)
        run: |
          api="http://$RIOT2_HOST:8080/api"
          variable() {
            curl -fsS -X POST "$api/nodes/variable/save" -H 'Content-Type: application/json' \
              -d "{\"id\":\"deploy-check\",\"name\":\"deploy-check\",\"description\":\"\",\"isPersistant\":true,\"type\":1,\"value\":\"$1\"}"
          }
          variable before
          curl -fsS -X POST "$api/v2/backup" -o "$RUNNER_TEMP/configuration.zip"
          unzip -l "$RUNNER_TEMP/configuration.zip"
          variable after
          curl -fsS -X POST "$api/v2/restore" -H 'Content-Type: application/zip' --data-binary "@$RUNNER_TEMP/configuration.zip"; echo
          [[ "$(curl -fsS "$api/nodes/variables")" == *'"before"'* ]] || { echo "::error::the restore did not bring the variable back"; exit 1; }
          # The replaced configuration is kept in the orchestrator-backups volume.
          [[ "$(curl -fsS "$api/v2/backups")" == *'riot2-pre-restore-'* ]] || { echo "::error::no pre-restore backup"; exit 1; }

      - name: Full-system backup and restore (backup.sh, restore.sh, backup.ps1, restore.ps1)
        run: |
          api="http://$RIOT2_HOST:8080/api"
          influx() {
            # shellcheck disable=SC2086,SC2016 # COMPOSE_ARGS holds several arguments; $DOCKER_* are the container's
            docker compose $COMPOSE_ARGS exec -T influxdb sh -c \
              'influx "$0" -o "$DOCKER_INFLUXDB_INIT_ORG" -t "$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN" "$@"' "$@"
          }
          check() {
            [[ "$(curl -fsS "$api/nodes/variables")" == *'"before"'* ]] || { echo "::error::$1: the variable is missing"; exit 1; }
            [[ "$(curl -fsS "$api/v2/backups")" == *'riot2-pre-restore-'* ]] || { echo "::error::$1: orchestrator-backups is empty"; exit 1; }
            docker run --rm -v riot2_elsa-data:/data:ro alpine:3.22 ls /data | grep -q sqlite \
              || { echo "::error::$1: Elsa's database is missing"; exit 1; }
            if [[ "$COMPOSE_ARGS" == *"compose.influx.yml"* ]]; then
              [[ "$(influx query -r 'from(bucket:"riot2") |> range(start: -1d) |> filter(fn: (r) => r._measurement == "deploy_check")')" == *deploy_check* ]] \
                || { echo "::error::$1: the InfluxDB point is missing"; exit 1; }
              grafana_password="$(grep '^RIOT2_GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-)"
              curl -fsS -u "admin:$grafana_password" "http://$RIOT2_HOST:3000/api/datasources/uid/riot2-influxdb/health"; echo
            fi
          }
          if [[ "$COMPOSE_ARGS" == *"compose.influx.yml"* ]]; then
            influx write -b riot2 'deploy_check value=1'
          fi

          # Each round trip wipes every volume, as on a clean host, and restores them.
          # shellcheck disable=SC2086
          ./backup.sh $COMPOSE_ARGS -o "$RUNNER_TEMP/bash"
          # shellcheck disable=SC2086
          docker compose $COMPOSE_ARGS down --volumes
          # shellcheck disable=SC2086
          ./restore.sh $COMPOSE_ARGS "$(ls -d "$RUNNER_TEMP"/bash/riot2-system-*)"
          check restore.sh

          # A damaged archive stops the restore before anything changes.
          damaged="$RUNNER_TEMP/damaged"
          cp -r "$(ls -d "$RUNNER_TEMP"/bash/riot2-system-*)" "$damaged"
          archive="$(find "$damaged/volumes" -name '*.tar.gz' | head -n 1)"
          head -c 100 "$archive" > "$archive.part" && mv "$archive.part" "$archive"
          # shellcheck disable=SC2086
          if ./restore.sh $COMPOSE_ARGS "$damaged"; then echo "::error::a damaged backup was restored"; exit 1; fi
          check "the damaged backup"

          pwsh -NoProfile -Command "./backup.ps1 $PS_ARGS -Output '$RUNNER_TEMP/pwsh'"
          # shellcheck disable=SC2086
          docker compose $COMPOSE_ARGS down --volumes
          pwsh -NoProfile -Command "./restore.ps1 $PS_ARGS -Path '$(ls -d "$RUNNER_TEMP"/pwsh/riot2-system-*)'"
          check restore.ps1

      - name: Show the state and logs
        if: always()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_ARGS ps --all
          # shellcheck disable=SC2086
          docker compose $COMPOSE_ARGS logs --no-color --timestamps

      - name: Remove the stack
        if: always()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_ARGS down --volumes

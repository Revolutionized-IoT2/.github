name: CI

# The hub's own checks: workflow lint (the reusable workflows here are used by every RIoT2
# repository), Markdown lint and the secret scan. The documentation drift check is
# docs-check.yml.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" checksums.txt | sha256sum --check --strict)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  tools:
    name: tool self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compose smoke test (tools/compose-smoke)
        run: |
          python3 tools/compose-smoke/test_health.py
          python3 tools/compose-smoke/test_pins.py
          shellcheck tools/compose-smoke/*.sh

      - name: Preflight and agent guardrail (tools/preflight, hooks)
        run: |
          python3 tools/preflight/test_preflight.py
          sh -n tools/preflight/git-hooks/pre-push
          shellcheck tools/preflight/git-hooks/pre-push
          python3 -c 'import json; json.load(open("hooks/riot2-guardrails.json"))'

  alert:
    needs: [actionlint, markdownlint, secret-scan, tools]
    if: >-
      always() && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci-alert.yml
    permissions:
      actions: read
      issues: write
    with:
      result: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}

# OpenTelemetry Collector for RIoT2 (deploy/compose.observability.yml, design 7.4). Every .NET
# service sends OTLP here when OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317. Metrics are
# exposed for Prometheus on port 8889, with the resource attributes (service_name,
# service_instance_id) as labels. Traces (RIOT2_TRACING=true) are only logged: no trace backend is
# bundled; add an exporter here to send them to one.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

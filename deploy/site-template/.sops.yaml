# Who can decrypt what (docs/guides/site-configuration.md, "Keys"): each host's files are encrypted
# for that host's age key and your personal key, the firmware records for your personal key only.
# Replace the placeholders with public keys (age1...) printed by age-keygen, then encrypt the files.
# After changing a rule, re-encrypt the files it covers: sops updatekeys <file>. The rules match
# the file's full path, with / or \ (Windows) between folders.
creation_rules:
  - path_regex: hosts[/\\]qnap[/\\].*\.sops(\.[^/\\]+)?$
    age: >-
      age1rx4vp8j55khhmekdl29ssh5j6laqv5ch6s6kghz93ku5zgrd2ptq6mfgf8,
      age10tcw38d2fv9y6ptnlae5chd2pwsl3ca060z73vazany3ghm5v4gsxhv8lt
  - path_regex: hosts[/\\]raspi[/\\].*\.sops(\.[^/\\]+)?$
    age: >-
      age155ud2lfxr2cp0cmdmnealsndlcacmpk0l4acunaaxyjgd9nuweeq8dt5et,
      age10tcw38d2fv9y6ptnlae5chd2pwsl3ca060z73vazany3ghm5v4gsxhv8lt
  - path_regex: firmware[/\\].*\.sops(\.[^/\\]+)?$
    age: >-
      age10tcw38d2fv9y6ptnlae5chd2pwsl3ca060z73vazany3ghm5v4gsxhv8lt
  